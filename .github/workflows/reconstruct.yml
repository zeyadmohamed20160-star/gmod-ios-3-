name: Garry's Mod Mobile IPA Construction Engine Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ipa-workspace:
    name: Run Cross-Platform Refiner and Apple IPA Compiler
    runs-on: macos-latest

    steps:
    - name: 🛰️ Download Source Repository Assets
      uses: actions/checkout@v4

    - name: 🐍 Initialize Python Interpreter Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 🛠️ Run Smart Logic Refiner & Reconstruction Pipeline
      run: |
        python reconstruct_core.py

    - name: 🧱 Generate Real Xcode Project Layout Container (.xcodeproj)
      run: |
        mkdir -p ios_project/build
        cat << 'XCODE' > ios_project/CMakeLists.txt
        cmake_minimum_required(VERSION 3.20)
        project(GModMobile CXX)
        set(CMAKE_CXX_STANDARD 17)
        add_executable(GModMobile Source/gmod_stitched_core.cpp)
        XCODE
        
        cd ios_project
        cmake -G "Xcode" -DCMAKE_OSX_SYSROOT=iphoneos .

    - name: 📱 Compile Native Mobile Binary & Package Resource Assets Bundle
      run: |
        cd ios_project
        # Run native xcode builds to generate optimized mobile binaries
        xcodebuild -project GModMobile.xcodeproj -scheme GModMobile -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO
        
        # Explicitly build the required Payload identity structure layers manually
        mkdir -p Payload/GModMobile.app
        
        # Copy the native executable target into the structural framework
        if [ -f "Release-iphoneos/GModMobile" ]; then
          cp "Release-iphoneos/GModMobile" Payload/GModMobile.app/GModMobile
        elif [ -f "build/Release-iphoneos/GModMobile" ]; then
          cp "build/Release-iphoneos/GModMobile" Payload/GModMobile.app/GModMobile
        else
          cp -r Release-iphoneos/GModMobile.app/* Payload/GModMobile.app/ 2>/dev/null || cp -r build/Release-iphoneos/GModMobile.app/* Payload/GModMobile.app/
        fi
        
        # Inject standard required Info.plist template metadata for iOS targets
        cat << 'PLIST' > Payload/GModMobile.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>GModMobile</string>
            <key>CFBundleIdentifier</key>
            <string>com.zezo.gmodmobile</string>
            <key>CFBundleName</key>
            <string>GModMobile</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
        </dict>
        </plist>
        PLIST
        
        # Copy the game resource assets directly inside the app folder layout container
        if [ -d "$GITHUB_WORKSPACE/gmod_assets" ]; then
          echo "[+] Located asset folder map. Mass packing resource textures..."
          cp -R "$GITHUB_WORKSPACE/gmod_assets/"* Payload/GModMobile.app/
        fi
        
        zip -r GModMobile_Compiled.ipa Payload

    - name: 📦 Archive Mobile Artifacts for Local Sideload Testing
      uses: actions/upload-artifact@v4
      with:
        name: gmod-mobile-ios-sideload-package
        path: ios_project/GModMobile_Compiled.ipa
        retention-days: 7
