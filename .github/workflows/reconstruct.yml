name: Garry's Mod Mobile IPA Construction Engine Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ipa-workspace:
    name: Run Cross-Platform Refiner and Apple IPA Compiler
    runs-on: macos-latest

    steps:
    - name: 🛰️ Download Source Repository Assets
      uses: actions/checkout@v4

    - name: 🐍 Initialize Python Interpreter Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 🛠️ Run Smart Logic Refiner & Reconstruction Pipeline
      run: |
        python reconstruct_core.py

    - name: 🧱 Generate Project Makefile Layout Structure
      run: |
        mkdir -p ios_project/build
        cat << 'XCODE' > ios_project/CMakeLists.txt
        cmake_minimum_required(VERSION 3.20)
        project(GModMobile CXX)
        set(CMAKE_CXX_STANDARD 17)
        add_executable(GModMobile Source/gmod_stitched_core.cpp)
        XCODE
        
        cd ios_project/build
        cmake -G "Unix Makefiles" -DCMAKE_OSX_SYSROOT=iphoneos ..

    - name: 📱 Execute Makefile Compilation Pipeline & Sign Target App Bundle (.ipa Package)
      run: |
        cd ios_project/build
        make GModMobile
        
        cd ../..
        mkdir -p ios_project/Payload/GModMobile.app
        cp ios_project/build/GModMobile ios_project/Payload/GModMobile.app/GModMobile
        
        # Inject standard required Info.plist template metadata for iOS target validation
        cat << 'PLIST' > ios_project/Payload/GModMobile.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>GModMobile</string>
            <key>CFBundleIdentifier</key>
            <string>com.zezo.gmodmobile</string>
            <key>CFBundleName</key>
            <string>GModMobile</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
        </dict>
        </plist>
        PLIST
        
        cd ios_project
        zip -r GModMobile_Unsigned.ipa Payload

    - name: 📦 Archive Mobile Artifacts for Local Sideload Testing
      uses: actions/upload-artifact@v4
      with:
        name: gmod-mobile-ios-sideload-package
        path: ios_project/GModMobile_Unsigned.ipa
        retention-days: 7
